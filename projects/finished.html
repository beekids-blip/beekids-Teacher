<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活動紀錄｜Bee Kids</title>
<link rel="stylesheet" href="../assets/site.css">
<script defer src="../assets/site.js"></script>
<script defer src="../assets/albums.js"></script>
</head>
<body>
<main id="main" class="page">
<article class="prose wide">

  <h1>活動紀錄</h1>
  <div data-albums data-csv="https://docs.google.com/spreadsheets/d/e/2PACX-1vR3P6p5UnGEkOSwMfRDNtmxhiTmpQigTBUe-CEWVKWLJNXDntJLeEE2XA3xpdi-iX_tMZsrdCT0RtAM/pub?gid=2082854569&single=true&output=csv"></div>

      <button type="button" class="to-top" aria-label="回到最上面" title="回到最上面">↑</button>
      <script>
      (() => {
      const b = document.querySelector('.to-top');
      b.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
      const t = () => b.classList.toggle('show', window.scrollY > 400);
      addEventListener('scroll', t, { passive: true }); t();
      })();
      </script>

  
</article>
</main>
